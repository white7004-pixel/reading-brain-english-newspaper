<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리딩브레인 영어 레벨테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin>
<link rel="icon" href="brand/rb-mark.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="test.js"></script>
</head>
<body class="exam">
<header class="exam-top">
  <p class="who"><img class="emblem" src="brand/rb-mark.png" alt=""><b id="who"></b><span id="section-name"></span></p>
  <div class="rail" id="dots" role="img" aria-label="단계 진행"></div>
  <div id="timer" class="clock" hidden>
    <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15"/><circle id="timer-ring" class="left" cx="18" cy="18" r="15" pathLength="90" transform="rotate(-90 18 18)"/></svg>
    <span id="timer-sec"></span>
  </div>
</header>
<p id="sample" class="sample-banner" hidden>문항 검수가 끝나기 전이라 <b>연습 문항</b>으로 치르는 화면 확인용 시험입니다. 결과는 실제 실력이 아닙니다.</p>
<main class="exam-main">
  <section id="intro" class="exam-card" hidden>
    <h2 id="intro-title"></h2>
    <p id="intro-text"></p>
    <button id="intro-go" type="button">시작</button>
  </section>
  <section id="item" class="split" hidden>
    <div class="pane" id="pane">
      <p id="pane-label" class="lab"></p>
      <div id="listen" class="player" hidden>
        <button id="play" type="button" aria-label="듣기">▶</button>
        <div>
          <p id="plays"></p>
          <div class="wave" aria-hidden="true"><i style="--h:10px"></i><i style="--h:22px"></i><i style="--h:30px"></i><i style="--h:16px"></i><i style="--h:26px"></i><i style="--h:12px"></i><i style="--h:28px"></i><i style="--h:20px"></i><i style="--h:34px"></i><i style="--h:14px"></i><i style="--h:24px"></i><i style="--h:9px"></i><i style="--h:30px"></i><i style="--h:18px"></i><i style="--h:26px"></i><i style="--h:12px"></i><i style="--h:22px"></i><i style="--h:16px"></i></div>
          <small id="listen-note"></small>
        </div>
      </div>
      <div id="given" class="given" hidden><p class="lab">주어진 문장</p><p id="given-text"></p></div>
      <div id="passage" class="passage" hidden></div>
      <p id="hint" class="kor" hidden></p>
    </div>
    <div class="qside">
      <div class="qh"><b id="qno"></b><p id="question" class="question"></p></div>
      <div id="choices" class="choices"></div>
      <form id="write" class="write" hidden autocomplete="off"><p id="write-line" class="write-line"></p><button type="submit">다음 문항</button></form>
    </div>
  </section>
  <p id="test-status" class="status" role="status"></p>
</main>
<footer class="exam-foot" id="foot" hidden><span id="foot-note"></span><span id="count"></span></footer>
</body>
</html>

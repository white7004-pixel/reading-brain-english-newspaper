<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리딩브레인 영어 레벨테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin>
<link rel="icon" href="brand/rb-mark.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body class="exam home">
<header class="site"><a class="logo" href="index.html"><img src="brand/rb-mark.png" alt=""><span>READING BRAIN<small>리딩브레인영어학원</small></span></a><span class="site-tag"><a href="forms-review.html">문제지 검수</a></span></header>
<main class="app">
  <div class="hero">
    <p class="eyebrow">LEVEL TEST<span>리딩브레인 영어 진단</span></p>
    <h1>영어 레벨테스트</h1>
    <p class="lede">초5 과정부터 한 단계씩 올라가며 듣기 · 어휘 · 문법 · 독해 · 영작을 봅니다. 영역마다 지금 어느 학년 과정에 와 있는지 결과리포트로 알려 드립니다.</p>
  </div>
  <div class="stats-row">
    <div class="stat"><span>단계</span><b>7<small>단계</small></b></div>
    <div class="stat"><span>문항</span><b>50<small>문항</small></b></div>
    <div class="stat"><span>시간</span><b>40<small>분 안팎</small></b></div>
    <div class="stat"><span>결과리포트</span><b>5<small>개 영역</small></b></div>
  </div>
  <section class="card">
    <h2><span class="step">STEP 01</span>학생 정보 <small>약 40분 · 이어폰을 끼고 봅니다</small></h2>
    <form id="student-form" class="grid">
      <label>학생 이름<input name="name" required maxlength="20" placeholder="이름" autocomplete="off"></label>
      <label>학교<input name="school" placeholder="OO중" maxlength="20" autocomplete="off"></label>
      <label>학년<select name="grade" required></select></label>
      <button class="wide">시험 시작</button>
    </form>
    <p id="student-status" class="status" role="status"></p>
    <p id="resume" class="notes" hidden>치르던 시험이 있습니다. <a href="test.html">이어서 보기</a></p>
  </section>
</main>
</body>
</html>

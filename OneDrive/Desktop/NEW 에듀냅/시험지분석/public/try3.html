<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>표지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--sans:'Pretendard Variable','Pretendard',system-ui,sans-serif}
*{box-sizing:border-box} body{margin:0;background:#15181c;font-family:var(--sans)}
main{max-width:980px;margin:0 auto;padding:26px 22px 80px}
.hold{border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.scale{width:100%;aspect-ratio:1;position:relative;overflow:hidden}
.num{font-variant-numeric:tabular-nums}

.c{width:1080px;height:1080px;position:absolute;inset:0;transform-origin:0 0;overflow:hidden;
  display:flex;flex-direction:column;gap:18px;padding:52px 54px 46px;color:#fff;
  --ink:#0e1b29; --cream:#f6f1e7; --cream2:#efe8da; --wine:#9b2c2c; --gold:#c9a227;
  --lo:#4a6fa5; --mid:#c08840; --hi:#a33b36;
  background:
    radial-gradient(820px 620px at 6% -6%, rgba(155,44,44,.34), transparent 62%),
    radial-gradient(760px 600px at 104% 104%, rgba(40,78,124,.4), transparent 60%),
    linear-gradient(165deg,#13263a 0%,#0b1724 55%,#0e1b29 100%)}
.c::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.c > *{position:relative;z-index:1}

/* 머리 */
.hd{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.hd .eye{font-size:14.5px;font-weight:800;letter-spacing:.26em;color:var(--gold)}
.hd .ln{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,39,.55),rgba(255,255,255,.07))}
.hd .who{font-size:15.5px;font-weight:700;color:rgba(255,255,255,.62)}

/* 제목 */
.ttl{flex:0 0 auto;display:flex;align-items:flex-end;gap:24px;padding-bottom:4px}
.ttl .sub{font-size:21px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:-.01em}
.ttl h1{margin:9px 0 0;font-size:58px;font-weight:800;letter-spacing:-.045em;line-height:1.04}
.ttl .rt{margin-left:auto;text-align:right;font-size:15.5px;font-weight:600;line-height:1.75;color:rgba(255,255,255,.46)}

/* 크림 패널 — 기준에서 가져온 결 */
.p{background:linear-gradient(176deg,var(--cream),var(--cream2));color:var(--ink);border-radius:20px;
  padding:24px 28px 26px;box-shadow:0 18px 40px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.9);
  display:flex;flex-direction:column;min-height:0}
.p > .lab{display:flex;align-items:center;gap:11px;padding-bottom:12px;margin-bottom:16px;
  border-bottom:1px solid rgba(14,27,41,.13);flex:0 0 auto}
.p > .lab b{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;
  background:var(--ink);color:var(--cream);font-size:12.5px;font-weight:800;letter-spacing:.02em}
.p > .lab span{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.p > .lab i{margin-left:auto;font-style:normal;font-size:14px;font-weight:600;color:rgba(14,27,41,.46)}

/* 01 문항 지도 */
.map{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:9px}
.q{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:16.5px;font-weight:800;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.q.l0{background:var(--lo)}.q.l1{background:var(--mid)}.q.l2{background:var(--hi)}
.key{margin-top:16px;display:flex;align-items:center;gap:22px;font-size:14.5px;font-weight:700;color:rgba(14,27,41,.66)}
.key i{display:flex;align-items:center;gap:8px;font-style:normal}
.key s{width:11px;height:11px;border-radius:3px;text-decoration:none}

/* 아래 두 패널 — 2×2 가 아니라 넓은 쪽·좁은 쪽 */
.low{flex:1;min-height:0;display:grid;grid-template-columns:1fr 326px;gap:18px}
.row{display:flex;align-items:center;gap:14px;padding:11px 0}
.row + .row{border-top:1px solid rgba(14,27,41,.1)}
.row .nm{width:68px;font-size:17px;font-weight:800}
.row .bar{flex:1;height:11px;border-radius:6px;background:rgba(14,27,41,.1);overflow:hidden}
.row .bar s{display:block;height:100%;border-radius:6px;text-decoration:none;
  background:linear-gradient(90deg,#b43b3b,var(--wine))}
.row .n{width:116px;text-align:right;font-size:16px;font-weight:800}
.row .n u{text-decoration:none;font-weight:600;color:rgba(14,27,41,.5);margin-left:5px;font-size:14px}

/* 02 패널 아래 남는 자리 — 난이도 띠로 채운다 */
.mix{margin-top:auto;padding-top:20px}
.mix .t{font-size:14px;font-weight:800;letter-spacing:.14em;color:rgba(14,27,41,.45);margin-bottom:12px}
.mix .b{display:flex;height:30px;border-radius:9px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.mix .b i{height:100%;display:grid;place-items:center;font-style:normal;font-size:14.5px;font-weight:800;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.25)}
.mix .c2{margin-top:11px;display:flex;font-size:14px;font-weight:700;color:rgba(14,27,41,.55)}
.mix .c2 span{text-align:center}

.st{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-height:0}
.st div{display:flex;align-items:baseline;gap:10px}
.st div + div{padding-top:13px;border-top:1px solid rgba(14,27,41,.1);margin-top:13px}
.st b{font-size:40px;font-weight:900;letter-spacing:-.055em;line-height:1}
.st b u{text-decoration:none;font-size:17px;margin-left:2px}
.st b.g{color:var(--wine)}
.st span{margin-left:auto;font-size:15.5px;font-weight:700;color:rgba(14,27,41,.52)}

/* 맺음 */
.ft{flex:0 0 auto;display:flex;align-items:center;gap:15px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16)}
.ft s{width:8px;height:8px;border-radius:50%;background:var(--gold);text-decoration:none;
  box-shadow:0 0 12px rgba(201,162,39,.85)}
.ft p{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.ft .pg{margin-left:auto;font-size:14px;font-weight:800;letter-spacing:.16em;color:rgba(255,255,255,.38)}
</style></head><body><main id="m"></main>
<script type="module">
const D = {
  학원:'리딩브레인영어학원', 학교:'빛가온중학교', 학년:'중2', 학기:'1학기', 시험:'중간고사', 과목:'영어',
  날짜:'2026. 4. 28.', 범위:'영어2 능률(김) 5~6과',
  문항:25, 배점:105, 서답형:24, 상:10,
  난이도:[{이름:'쉬움',수:5,비율:20},{이름:'보통',수:10,비율:40},{이름:'어려움',수:10,비율:40}],
  영역:[{이름:'독해',수:7,점:30,비율:28},{이름:'어휘',수:6,점:25,비율:24},
        {이름:'어법',수:6,점:25,비율:24},{이름:'대화문',수:6,점:25,비율:24}],
  문항들:[...Array(20)].map((_,i)=>({no:String(i+1),lv:[0,1,1,2,2][i%5]}))
    .concat([1,2,3,4,5].map(n=>({no:'서'+n,lv:[0,1,2,2,1][n-1]}))),
  한줄:'열 문항이 등수를 갈랐습니다',
};
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const 색=['var(--lo)','var(--mid)','var(--hi)'];
const 최대=Math.max(...D.영역.map(a=>a.비율));

const 카드 = ()=>`<div class="c">
  <div class="hd"><span class="eye">${E(D.과목)} 내신 분석</span><span class="ln"></span><span class="who">${E(D.학원)}</span></div>

  <div class="ttl"><div>
    <div class="sub">${E(D.학교)} ${E(D.학년)}</div>
    <h1>${E(D.학기)} ${E(D.시험)}</h1></div>
    <div class="rt">${E(D.날짜)}<br>${E(D.범위)}</div>
  </div>

  <div class="p map">
    <div class="lab"><b>01</b><span>문항 지도</span><i>${D.문항}문항을 번호 차례로 폈습니다</i></div>
    <div class="grid num">${D.문항들.map(q=>`<div class="q l${q.lv}">${E(q.no)}</div>`).join('')}</div>
    <div class="key num">${D.난이도.map((x,i)=>`<i><s style="background:${색[i]}"></s>${E(x.이름)} ${x.수}문항 · ${x.비율}%</i>`).join('')}</div>
  </div>

  <div class="low">
    <div class="p">
      <div class="lab"><b>02</b><span>어디서 많이 물었나</span></div>
      ${D.영역.map(a=>`<div class="row"><span class="nm">${E(a.이름)}</span>
        <span class="bar"><s style="width:${(a.비율*100/최대).toFixed(0)}%"></s></span>
        <span class="n num">${a.수}문항<u>${a.점}점</u></span></div>`).join('')}
      <div class="mix"><div class="t">어려움 정도</div>
        <div class="b num">${D.난이도.map((x,i)=>`<i style="width:${x.비율}%;background:${색[i]}">${x.비율}%</i>`).join('')}</div>
        <div class="c2 num">${D.난이도.map((x)=>`<span style="width:${x.비율}%">${E(x.이름)} ${x.수}문항</span>`).join('')}</div>
      </div>
    </div>
    <div class="p">
      <div class="lab"><b>03</b><span>한눈에</span></div>
      <div class="st num">
        <div><b>${D.문항}</b><span>문항 수</span></div>
        <div><b>${D.배점}<u>점</u></b><span>만점</span></div>
        <div><b>${D.서답형}<u>%</u></b><span>서답형 몫</span></div>
        <div><b class="g">${D.상}</b><span>어려운 문항</span></div>
      </div>
    </div>
  </div>

  <div class="ft"><s></s><p>${E(D.한줄)}</p><span class="pg">01 / 05</span></div>
</div>`;

document.getElementById('m').innerHTML = `<div class="hold"><div class="scale">${카드()}</div></div>`;
const fit=()=>document.querySelectorAll('.scale').forEach(b=>{const c=b.firstElementChild; if(c)c.style.transform=`scale(${b.clientWidth/1080})`;});
fit(); addEventListener('resize',fit); document.fonts?.ready.then(fit);
</script></body></html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f3651" />
    <title>리딩브레인 · 오프라인</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #24345b; background: #f4f8fc; font-family: system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; box-sizing: border-box; text-align: center; background: white; border: 2px solid #dce6f0; border-radius: 24px; box-shadow: 0 12px 30px rgba(36, 52, 91, .12); }
      img { width: 80px; height: 80px; object-fit: contain; border-radius: 18px; }
      h1 { margin: 18px 0 10px; font-size: 24px; }
      p { margin: 0; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/icons/icon-192.png" alt="" />
      <h1>인터넷 연결이 필요해요</h1>
      <p>처음 한 번은 온라인에서 리딩브레인을 열어 주세요. 준비가 끝나면 학습 콘텐츠와 진도를 오프라인에서도 사용할 수 있어요.</p>
    </main>
  </body>
</html>

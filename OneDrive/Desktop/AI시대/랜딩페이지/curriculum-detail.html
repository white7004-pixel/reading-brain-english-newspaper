<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리딩브레인 커리큘럼 상세</title>
<style>
  :root { --navy:#0C354D; --gold:#B89A62; --maroon:#8B1E24; --gray-700:#18242D; --white:#ffffff; --gray-100:#F6F2E9; font-family:'Noto Sans KR',sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#f8fafc;color:#18232f;line-height:1.8;}
  a{color:inherit;text-decoration:none;}
  .page-wrap{max-width:1100px;margin:0 auto;padding:28px 24px;}
  .top-bar{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .top-bar h1{font-size:28px;color:var(--navy);line-height:1.2;}
  .top-bar a{padding:12px 18px;background:var(--gold);color:var(--navy);font-weight:700;border-radius:10px;}
  .step-card{background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(7,49,77,0.08);overflow:hidden;border:1px solid rgba(7,49,77,0.08);}
  .step-hero{position:relative;height:320px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:24px;color:#fff;}
  .step-badge{background:rgba(0,0,0,0.45);padding:10px 16px;border-radius:999px;font-size:13px;letter-spacing:1px;}
  .step-body{padding:32px 32px 36px;}
  .step-title{font-size:26px;font-weight:800;color:var(--navy);margin:18px 0 16px;}
  .step-desc{color:var(--gray-700);font-size:16px;margin-bottom:18px;}
  .step-list{list-style:none;margin:0;padding:0;}
  .step-list li{position:relative;padding:14px 0 14px 24px;font-size:15px;color:var(--gray-700);border-top:1px solid #e5e7eb;}
  .step-list li:first-child{border-top:none;}
  .step-list li::before{content:'✓';position:absolute;left:0;top:14px;color:var(--gold);font-weight:800;}
  .empty-state{padding:60px 24px;text-align:center;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(7,49,77,0.08);}
  .empty-state h2{font-size:24px;color:var(--navy);margin-bottom:16px;}
  .empty-state p{color:#556170;font-size:15px;}
  .note{margin-top:24px;font-size:14px;color:#475569;background:var(--gray-100);padding:18px 20px;border-radius:14px;border:1px solid #e2e8f0;}
  @media(max-width:720px){.top-bar{flex-direction:column;align-items:flex-start;} .step-hero{height:240px;} .step-body{padding:24px;}}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="top-bar">
    <div>
      <h1>커리큘럼 상세 설명</h1>
      <p style="margin-top:8px;color:#475569;">각 단계의 핵심 내용을 새 탭으로 열어 자세히 확인하세요.</p>
    </div>
    <a href="index.html#curriculum">메인으로 돌아가기</a>
  </div>

  <div id="content"></div>
  <div class="note">새 탭에서 상세 설명을 확인하세요. 단계별로 학습 흐름과 핵심 포인트를 정리했습니다.</div>
</div>
<script>
  const data = {
    '1': {
      step:'STEP 01',
      title:'레벨 테스트 — 정확한 출발점',
      image:'images/phonics-class-actual.jpg',
      desc:'모든 학습은 정확한 진단에서 시작됩니다. AR TEST를 통해 학생의 현재 AR(Accelerated Reader) 지수와 4대 영역(Reading·Listening·Speaking·Writing) 균형을 정밀 분석합니다.',
      points:[
        'AR TEST 기반 AR 지수 측정',
        '어휘·구문·청해 종합 진단',
        '학습 성향 및 강·약점 리포트 제공',
        '학부모 1:1 상담 결과 안내'
      ]
    },
    '2': {
      step:'STEP 02',
      title:'맞춤 설계 — 100명 100개의 커리큘럼',
      image:'images/signature-one-on-one-class.jpg',
      desc:'100명의 아이들에게는 100개의 서로 다른 커리큘럼이 필요합니다. 진단 결과를 토대로 학생 한 명을 위한 단계별 학습 로드맵과 도서 큐레이션을 설계합니다.',
      points:[
        '개인별 AR 목표 및 단계별 마일스톤 설정',
        '수준에 맞는 원서 도서 큐레이션',
        '주·월간 학습 분량과 과제 정밀 배정',
        '학부모 정기 피드백 리포트 발행'
      ]
    },
    '3': {
      step:'STEP 03',
      title:'원서 정독 — 1:1 밀착 코칭',
      image:'images/usa-curriculum-workbook.jpg',
      desc:'원어민·교포·조교 선생님이 1:1로 밀착 코칭합니다. 단순 해석이 아닌 작가의 의도를 읽어내는 깊이 있는 정독으로 4대 영역을 통합 학습합니다.',
      points:[
        '원어민·교포·조교 3중 코칭 시스템',
        'Reading·Listening·Speaking·Writing 통합 수업',
        '문장 단위 해석이 아닌 의미 단위 정독',
        'Bilingual 사고 훈련'
      ]
    },
    '4': {
      step:'STEP 04',
      title:'아웃풋 — 표현하는 영어',
      image:'images/newspaper-nonfiction-class.jpg',
      desc:'읽은 만큼 말하고 쓸 수 있어야 진짜 실력입니다. Book Talking과 Report Writing을 통해 학습한 내용을 자신의 언어로 재구성하고 발표하는 능동적 학습을 진행합니다.',
      points:[
        'Book Talking — 도서별 발표 및 토론',
        'Report Writing — 비평·요약·에세이',
        '원어민 첨삭과 1:1 피드백',
        '발표력·논리력·표현력 동시 향상'
      ]
    },
    '5': {
      step:'STEP 05',
      title:'성장 확인 — 데이터로 증명하는 결과',
      image:'images/personalized-learning-report.jpg',
      desc:'감(感)이 아닌 데이터로 성장을 증명합니다. 연 10회 정기고사와 AR 레벨 추적 시스템으로 학생의 변화를 정량적으로 확인하고 다음 단계 전략을 세웁니다.',
      points:[
        '연 10회 정기 평가 및 누적 그래프',
        'AR 레벨업 추적 및 도서 이력 관리',
        '월간 학부모 리포트 자동 발송',
        '고1까지 고교 내신 1등급 로드맵'
      ]
    }
  };

  const params = new URLSearchParams(window.location.search);
  const step = params.get('step');
  const selected = data[step];
  const content = document.getElementById('content');

  if (!selected) {
    content.innerHTML = '<div class="empty-state"><h2>커리큘럼 단계를 선택해 주세요.</h2><p>메인 페이지에서 단계별 커리큘럼 카드를 클릭하면 각 단계의 상세 설명을 새 탭에서 확인할 수 있습니다.</p></div>';
  } else {
    content.innerHTML = `
      <article class="step-card">
        <div class="step-hero" style="background-image:url('${selected.image}');">
          <span class="step-badge">${selected.step}</span>
        </div>
        <div class="step-body">
          <h2 class="step-title">${selected.title}</h2>
          <p class="step-desc">${selected.desc}</p>
          <ul class="step-list">
            ${selected.points.map(point => `<li>${point}</li>`).join('')}
          </ul>
        </div>
      </article>
    `;
  }
</script>
</body>
</html>

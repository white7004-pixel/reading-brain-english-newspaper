<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123d35">
  <title>문법 AI 선생님</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <header class="topbar">
    <a class="brand" href="#" aria-label="문법 AI 선생님 홈">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span><strong>문법 AI 선생님</strong><small>천일문 중등 GRAMMAR 1·2·3</small></span>
    </a>
    <div class="top-actions">
      <span class="offline-badge">무료 · 로컬 학습</span>
      <button id="settings-button" class="icon-button" type="button" aria-expanded="false" aria-controls="settings-panel">설정</button>
    </div>
  </header>

  <main id="main-content">
    <section id="home-view" class="home-view" aria-labelledby="welcome-title">
      <div class="hero-copy">
        <p class="eyebrow">오늘도 한 단원, 확실하게</p>
        <h1 id="welcome-title">문법을 외우지 말고<br><em>문장 속에서 이해해요.</em></h1>
        <p>교재의 단원을 고르면 문법 선생님이 개념부터 확인 문제까지 차근차근 안내합니다.</p>
        <div id="progress-summary" class="progress-card" aria-live="polite">
          <div><span>나의 학습 진도</span><strong id="progress-text">0 / 92 단원</strong></div>
          <div class="progress-track" role="progressbar" aria-label="전체 학습 진도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><b id="progress-bar"></b></div>
        </div>
      </div>

      <form id="lesson-picker" class="picker-card">
        <div class="picker-heading"><span aria-hidden="true">✦</span><div><strong>수업 선택</strong><small>배울 단원을 골라 주세요</small></div></div>
        <label for="book-select">교재</label>
        <select id="book-select" aria-label="교재 선택"></select>
        <label for="chapter-select">챕터</label>
        <select id="chapter-select" aria-label="챕터 선택"></select>
        <label for="unit-select">단원</label>
        <select id="unit-select" aria-label="단원 선택"></select>
        <button id="start-button" class="primary-button" type="submit">수업 시작하기 <span aria-hidden="true">→</span></button>
        <button id="recent-button" class="text-button" type="button" hidden>최근 수업 이어서 하기</button>
      </form>
    </section>

    <section id="class-view" class="class-view" hidden aria-label="문법 수업">
      <nav class="class-nav" aria-label="수업 탐색">
        <button id="home-button" type="button">← 단원 선택</button>
        <div class="unit-meta"><span id="book-label"></span><strong id="unit-title"></strong><small id="page-reference"></small></div>
        <button id="download-script" type="button">대본 저장</button>
        <button id="print-lesson" type="button">인쇄</button>
      </nav>

      <div class="class-layout">
        <section class="board-frame" aria-live="polite">
          <div class="board">
            <div id="step-pins" class="step-pins" aria-label="수업 단계"></div>
            <div class="teacher" aria-hidden="true">
              <div class="teacher-head"><span class="hair"></span><span class="face">•‿•</span></div>
              <div class="teacher-body"><span>G</span></div>
              <i class="pointer"></i>
            </div>
            <article id="lesson-stage" class="lesson-card"></article>
            <div id="teacher-bubble" class="teacher-bubble"></div>
          </div>
          <div class="chalk-tray">
            <button id="prev-button" type="button">← 이전</button>
            <button id="play-button" class="play-button" type="button">▶ 자동 수업</button>
            <button id="next-button" type="button">다음 →</button>
            <span class="tray-spacer"></span>
            <button id="speak-button" type="button">🔊 읽기</button>
          </div>
        </section>

        <aside class="side-panel">
          <section>
            <h2>수업 순서</h2>
            <ol id="lesson-flow" class="lesson-flow"></ol>
          </section>
          <section>
            <h2>목소리 도구</h2>
            <p id="speech-status" class="status">브라우저 기본 음성을 사용합니다.</p>
            <label for="speech-rate">읽기 속도 <output id="rate-output">1.0×</output></label>
            <input id="speech-rate" type="range" min="0.6" max="1.3" value="1" step="0.1">
            <div class="record-actions">
              <button id="record-button" type="button">● 교사 음성 녹음</button>
              <button id="record-play" type="button" disabled>재생</button>
              <button id="record-download" type="button" disabled>저장</button>
            </div>
            <p id="record-status" class="status">단계별 설명을 직접 녹음할 수 있어요.</p>
          </section>
        </aside>
      </div>

      <section id="quiz-panel" class="quiz-panel" hidden aria-labelledby="quiz-title"></section>
    </section>
  </main>

  <aside id="settings-panel" class="settings-panel" hidden aria-label="학습 설정">
    <h2>학습 설정</h2>
    <label><input id="subtitle-toggle" type="checkbox" checked> 선생님 설명 말풍선 표시</label>
    <label for="font-scale">글자 크기</label>
    <input id="font-scale" type="range" min="0.9" max="1.2" value="1" step="0.05">
    <button id="reset-progress" class="danger-button" type="button">진도 초기화</button>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>

<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습하기 · 리딩브레인</title>
<link rel="stylesheet" href="app.css">
<style>
/* 장서 4,820권의 학습 화면. 기존 책(app.html)과 같은 아홉 단계지만,
   우리가 읽지 않은 책이라 내용을 적어 두지 않고 아이가 채우는 워크시트로 둔다.
   낭독 영상만은 유튜브에서 찾아 그대로 붙인다. 인쇄하면 아홉 장이 학습지가 된다. */
.ws-tbl{width:100%; border-collapse:collapse; font-size:14px}
.ws-tbl th,.ws-tbl td{border:1px solid #e3d7ec; padding:6px 8px; vertical-align:top}
.ws-tbl th{background:#f5ecfa; color:#7b4f99; font-size:12.5px; white-space:nowrap}
.ws-tbl input{width:100%; border:0; font:inherit; outline:none; background:transparent}
.ws-tbl td.no{width:2.2em; text-align:center; color:#a597b0}
.swbst{display:grid; gap:8px}
.swbst label{display:grid; grid-template-columns:8.5em 1fr; gap:8px; align-items:center}
.swbst b{color:#7b4f99; font-size:13px}
.swbst input{border:0; border-bottom:1.5px solid #d9c6e6; font:inherit; padding:5px 2px; outline:none; background:transparent}
.mmap{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mmap div{border:1.5px dashed #c9a8dd; border-radius:12px; padding:8px 10px}
.mmap b{display:block; color:#7b4f99; font-size:12.5px; margin-bottom:4px}
.mmap textarea{width:100%; border:0; outline:none; background:transparent; font:inherit; resize:vertical}
.bigcv{width:132px; aspect-ratio:3/4; border-radius:10px; background:#f1e8f6 center/cover no-repeat;
  box-shadow:0 3px 12px rgba(120,60,160,.2); flex:none}
.abt{display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start}
@media print{
  .top,.tabs,.btn,.noprint,.tube,.chat,.talkin{display:none !important}
  .panel[hidden]{display:block !important}
  .panel{page-break-inside:avoid; margin-bottom:10px}
  body{background:#fff}
}
@media (max-width:560px){ .mmap{grid-template-columns:1fr} .swbst label{grid-template-columns:1fr} }
</style>
</head><body>

<div class="top">
  <a class="home" href="index.html">← 목록</a>
  <div class="cv" id="cv"></div>
  <div class="bk"><b id="bt">…</b><span id="bs"></span></div>
  <a class="ws" href="javascript:print()">인쇄</a>
  <div class="sp"></div>
  <label for="who">이름</label>
  <input class="who" id="who" placeholder="김리브로" autocomplete="off">
  <span class="saved" id="saved"></span>
  <span id="chip"></span>
</div>

<div class="tabs" id="tabs"></div>
<main>
  <section class="panel" id="p-about"  hidden></section>
  <section class="panel" id="p-shadow" hidden></section>
  <section class="panel" id="p-rec"    hidden></section>
  <section class="panel" id="p-talk"   hidden></section>
  <section class="panel" id="p-word"   hidden></section>
  <section class="panel" id="p-sum"    hidden></section>
  <section class="panel" id="p-map"    hidden></section>
  <section class="panel" id="p-think"  hidden></section>
  <section class="panel" id="p-essay"  hidden></section>
</main>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="catalog.js"></script>
<script src="catalog-covers.js"></script>
<script src="talk-local.js"></script>
<script>
RB.gate();
RB.chip(document.getElementById("chip"));
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const $ = id => document.getElementById(id);
const NO = new URLSearchParams(location.search).get("no") || "";
const idx = CATALOG.books.findIndex(b => b[0] === NO);
const COVER = no => {
  const c = (window.CATALOG_COVERS || {})[no];
  return c ? "https://covers.openlibrary.org/b/id/" + c + "-M.jpg" : "";
};

// 이름을 정하는 법은 app.html 과 똑같이 한다. 로그인한 학생은 고정, 아니면 이 브라우저에 기억한다.
let WHO = "";
if (RB.role() === "student") {
  WHO = RB.whoKey();
  $("who").hidden = true; document.querySelector("label[for=who]").hidden = true;
} else {
  WHO = localStorage.getItem("rb1:who") || "";
  $("who").value = WHO;
  $("who").addEventListener("change", function(){
    WHO = $("who").value.trim();
    localStorage.setItem("rb1:who", WHO);
    S = load(); T = null; show();                 // 이름이 바뀌면 그 아이가 적은 것을 다시 그린다
  });
}
// RB.save/RB.load 는 (slug, who, part, data) 네 자리다 (store.js). 책(Book No.) 하나가 slug 다.
// 책마다 따로 저장해야 다른 책·다른 탭이 서로 덮어쓰지 않는다.
const BLANK = { star: 0, date: "", a: ["", "", ""], note: "", words: "",
                voc: [], swbst: ["", "", "", "", ""], mm: ["", "", "", ""], essay: "", talk: 0 };
function load(){
  const r = (RB.load(NO, WHO, "act") || {}).data || {};
  const s = {};
  for (const k in BLANK) {
    s[k] = r[k] !== undefined ? r[k] : (Array.isArray(BLANK[k]) ? BLANK[k].slice() : BLANK[k]);
  }
  return s;
}
let S = load(), B = null, A = null, V = [], T = null, flash = null;
function flashSaved(msg){
  $("saved").textContent = msg || "저장됨";
  clearTimeout(flash); flash = setTimeout(function(){ $("saved").textContent = ""; }, 1600);
}
function save(){
  if (!WHO) { $("saved").textContent = "이름을 먼저 적어 주세요"; return; }
  RB.save(NO, WHO, "act", S);
  flashSaved();
}

/* ───────── 탭 ───────── */
// 기존 책(app.html)의 아홉 단계와 같은 차례다. 단어학습·북퀴즈 자리에는
// 우리가 답을 아는 척할 수 없으므로 아이가 채우는 낱말 노트·요약 지도가 들어간다.
const TABS = [
  { id: "about",  name: "책 소개",   draw: drawAbout  },
  { id: "shadow", name: "쉐도잉",     draw: drawShadow },
  { id: "rec",    name: "낭독녹음",   draw: drawRec    },
  { id: "talk",   name: "AI 북토크",  draw: drawTalk   },
  { id: "word",   name: "낱말 노트",  draw: drawWord   },
  { id: "sum",    name: "요약 지도",  draw: drawSum    },
  { id: "map",    name: "마인드맵",   draw: drawMap    },
  { id: "think",  name: "생각 질문",  draw: drawThink  },
  { id: "essay",  name: "독후 논술",  draw: drawEssay  },
];
let TAB = "about";
function show(){
  TABS.forEach(function(t){ $("p-" + t.id).hidden = t.id !== TAB; });
  TABS.find(function(t){ return t.id === TAB; }).draw();
  $("tabs").innerHTML = TABS.map(function(t){
    return '<button data-t="' + t.id + '" class="' + (t.id === TAB ? "on" : "") + " " +
      (filled(t.id) ? "done" : "") + '">' + t.name + "</button>";
  }).join("");
  $("tabs").querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ TAB = b.dataset.t; location.hash = TAB; show(); };
  });
}
const has = v => Array.isArray(v) ? v.some(x => String(x || "").trim()) : String(v || "").trim() !== "";
function filled(id){
  if (id === "about") return S.star > 0 || has(S.note);
  if (id === "talk")  return S.talk > 0;
  if (id === "word")  return S.voc.some(has);
  if (id === "sum")   return has(S.swbst);
  if (id === "map")   return has(S.mm);
  if (id === "think") return has(S.a);
  if (id === "essay") return has(S.essay);
  return false;
}

/* 칸 하나가 바뀔 때마다 그 자리에 담아 두고, 칸을 떠날 때 저장한다 (main 하나에만 귀를 단다) */
const MAIN = document.querySelector("main");
MAIN.addEventListener("input", function(e){
  const el = e.target, k = el.dataset.k;
  if (!k) return;
  const i = el.dataset.i;
  if (i === undefined) S[k] = el.value;
  else if (k === "voc") { S.voc[i] = S.voc[i] || ["", "", ""]; S.voc[i][el.dataset.j] = el.value; }
  else S[k][i] = el.value;
});
MAIN.addEventListener("change", function(e){ if (e.target.dataset.k) save(); });

function tx(k, i, rows, ph){
  return '<textarea data-k="' + k + '"' + (i === undefined ? "" : ' data-i="' + i + '"') +
    ' rows="' + (rows || 3) + '" placeholder="' + esc(ph || "") + '">' +
    esc(i === undefined ? S[k] : S[k][i]) + "</textarea>";
}

/* ───────── ① 책 소개 ───────── */
function drawAbout(){
  const cv = COVER(NO);
  $("p-about").innerHTML =
    '<div class="box"><div class="abt">' +
      '<div class="bigcv"' + (cv ? ' style="background-image:url(\'' + esc(cv) + '\')"' : "") + '></div>' +
      '<div style="flex:1; min-width:220px">' +
        '<h2 style="margin:0 0 4px">' + esc(B.title) + "</h2>" +
        '<p class="sub" style="margin:0 0 8px">' + esc(B.author) +
          (B.series === "No series" ? "" : " · " + esc(B.series)) + "</p>" +
        '<div class="row" style="gap:6px; flex-wrap:wrap; margin-bottom:10px">' +
          '<span class="count">AR ' + B.bl.toFixed(1) + "</span>" +
          (B.lexile ? '<span class="count">Lexile ' + esc(B.lexile) + "</span>" : "") +
          '<span class="count">' + (B.nf ? "논픽션" : "픽션") + "</span>" +
          '<span class="count">' + esc(B.genre) + "</span>" +
          '<span class="count">' + esc(B.theme) + "</span>" +
          (B.award ? '<span class="count">🏅 ' + esc(B.award) + "</span>" : "") +
        "</div>" +
        (A && A.s ? '<div class="rpcom">' + esc(A.s) + "</div>" : "") +
      "</div></div></div>" +
    '<div class="box"><h2>별점과 읽은 날</h2>' +
      '<div class="row" id="stars">' + [1,2,3,4,5].map(function(n){
        return '<button class="btn ghost" data-n="' + n + '">' + (n <= S.star ? "★" : "☆") + "</button>";
      }).join("") + "</div>" +
      '<label>읽은 날 <input type="date" data-k="date" value="' + esc(S.date) + '"></label></div>' +
    '<div class="box"><h2>한 줄 감상</h2>' + tx("note", undefined, 2, "이 책을 한 문장으로 말하면?") + "</div>";
  $("stars").querySelectorAll("button").forEach(function(x){
    x.onclick = function(){
      S.star = +x.dataset.n; save();
      $("stars").querySelectorAll("button").forEach(function(y){
        y.textContent = +y.dataset.n <= S.star ? "★" : "☆";
      });
    };
  });
}

/* ───────── ② 쉐도잉 ───────── */
// scripts/find-videos.mjs 가 책 이름으로 유튜브를 찾아 vid/<묶음>.js 에 적어 둔 영상이다.
// 영상을 내려받지 않는다 — 유튜브가 그대로 재생한다.
let EP = 0;
function drawShadow(){
  const yt = "https://www.youtube.com/results?search_query=" + encodeURIComponent('"' + B.title + '" read aloud');
  if (!V.length) {
    $("p-shadow").innerHTML =
      '<div class="box"><h2>낭독 영상</h2>' +
      '<p class="sub">이 책은 아직 찾아 둔 낭독 영상이 없습니다. 유튜브에서 직접 찾아 보세요.</p>' +
      '<a class="btn ghost" href="' + esc(yt) + '" target="_blank" rel="noopener">유튜브에서 찾기</a></div>';
    return;
  }
  if (EP >= V.length) EP = 0;
  const it = V[EP];
  $("p-shadow").innerHTML =
    '<h2 class="h">낭독을 들으며 따라 읽으세요</h2>' +
    '<p class="sub">Listen and read along. 책을 펴 놓고 소리 내어 따라 읽어 보세요.</p>' +
    '<div class="box">' +
      '<div class="tube"><iframe src="https://www.youtube.com/embed/' + esc(it[0]) + '"' +
      ' title="' + esc(it[1]) + '" allow="accelerometer; encrypted-media; picture-in-picture"' +
      ' allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>' +
      (V.length > 1 ? '<div class="eps">' + V.map(function(v, i){
        return '<button data-i="' + i + '" class="' + (i === EP ? "on" : "") + '">' +
          esc(v[1] || ("영상 " + (i + 1))) + "</button>";
      }).join("") + "</div>" : "") +
      '<p class="sub" style="margin-top:10px">영상이 이 책과 다르면 ' +
      '<a href="' + esc(yt) + '" target="_blank" rel="noopener">유튜브에서 직접 찾기</a></p>' +
    "</div>";
  $("p-shadow").querySelectorAll(".eps button").forEach(function(b){
    b.onclick = function(){ EP = +b.dataset.i; drawShadow(); };
  });
}

/* ───────── ③ 낭독 녹음 ───────── */
// app.html 의 recorder 와 같은 것. 열쇠만 slug 대신 Book No. 를 쓴다.
function drawRec(){
  $("p-rec").innerHTML =
    '<h2 class="h">소리 내어 읽고 녹음하세요</h2>' +
    '<p class="sub">마음에 드는 한 쪽을 골라 30초쯤 읽어 보세요. 녹음한 것은 선생님이 들을 수 있습니다.</p>' +
    '<div class="box"><div id="recbox"></div></div>';
  recorder($("recbox"), "readaloud");
}
function recorder(host, tag){
  host.innerHTML = '<div class="rec">' +
      '<button class="btn red" data-go>● 녹음 시작</button>' +
      '<span data-st class="count"></span>' +
      "<audio data-au controls hidden></audio>" +
      '<button class="btn ghost" data-del hidden>지우기</button></div>';
  const go = host.querySelector("[data-go]"), st = host.querySelector("[data-st]"),
        au = host.querySelector("[data-au]"), del = host.querySelector("[data-del]");
  let mr = null, chunks = [], t0 = 0, tick = null;

  const put = function(blob){
    au.src = URL.createObjectURL(blob); au.hidden = false; del.hidden = false;
    if (WHO) RB.putAudio(NO, WHO, tag, blob).then(function(){ flashSaved("녹음 저장됨"); });
  };
  if (WHO) RB.getAudio(NO, WHO, tag).then(function(b){ if (b) put(b); }).catch(function(){});

  del.onclick = function(){
    au.hidden = true; del.hidden = true; au.removeAttribute("src");
    if (WHO) RB.dropAudio(NO, WHO, tag).then(function(){ flashSaved("녹음 지움"); });
  };
  go.onclick = async function(){
    if (mr && mr.state === "recording") { mr.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      host.insertAdjacentHTML("beforeend",
        '<div class="warn">이 브라우저에서는 녹음이 안 됩니다. 크롬으로 열어 주세요.</div>');
      return;
    }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) {
      host.insertAdjacentHTML("beforeend",
        '<div class="warn">마이크를 쓸 수 없습니다. 브라우저 주소창의 마이크 권한을 허용해 주세요.</div>');
      return;
    }
    chunks = []; mr = new MediaRecorder(stream);
    mr.ondataavailable = function(e){ chunks.push(e.data); };
    mr.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(tick);
      go.textContent = "● 다시 녹음"; go.classList.add("red");
      st.innerHTML = "";
      put(new Blob(chunks, { type: mr.mimeType || "audio/webm" }));
    };
    mr.start(); t0 = Date.now();
    go.textContent = "■ 정지"; go.classList.remove("red");
    tick = setInterval(function(){
      const s = Math.floor((Date.now() - t0) / 1000);
      st.innerHTML = '<span class="dot"></span> ' + String(Math.floor(s / 60)).padStart(2, "0") +
        ":" + String(s % 60).padStart(2, "0");
    }, 200);
  };
}

/* ───────── ④ AI 북토크 ───────── */
// talk-local.js 의 연습 모드를 그대로 쓴다. 그 책의 내용 질문(comprehension)은 우리에게 없으므로
// 일상 영어 대화와 책 느낌 이야기로만 이끈다 — 지어낸 줄거리를 아이에게 묻지 않는다.
function drawTalk(){
  const P = $("p-talk");
  if (!T) {
    P.innerHTML =
      '<h2 class="h">AI와 책 이야기하기</h2>' +
      '<p class="sub">영어로 2~3분 이야기해요. 인사와 오늘 한 일로 말문을 열고 <b>' + esc(B.title) +
      '</b> 이야기로 넘어갑니다.</p>' +
      '<div class="box talkintro"><ol>' +
      "<li>영어로 대답해요. 타자로 써도 되고, 🎤 를 눌러 말해도 됩니다.</li>" +
      '<li>틀려도 괜찮아요. <b>"I don\'t know."</b> 라고 해도 됩니다.</li>' +
      "<li>아래 <b>이렇게 말해 보세요</b> 틀에 빈칸만 채우면 쉬워요.</li></ol>" +
      (S.talk ? '<div class="count" style="margin-bottom:10px">지금까지 ' + S.talk + "번 이야기했어요</div>" : "") +
      '<button class="btn" id="tstart">대화 시작</button></div>';
    $("tstart").onclick = function(){ T = { history: [], hint: "", done: false }; say(null); };
    return;
  }
  P.innerHTML =
    '<div class="chat" id="chat">' + T.history.map(function(h){
      return '<div class="msg ' + (h.role === "user" ? "me" : "ai") + '">' + esc(h.text) + "</div>";
    }).join("") + "</div>" +
    '<div class="hintline">' + (T.hint ? "이렇게 말해 보세요 · " + esc(T.hint) : "") + "</div>" +
    '<div class="talkin" id="tin"' + (T.done ? " hidden" : "") + '>' +
      '<button class="btn red" id="tmic">🎤 말하기</button>' +
      '<input id="ttext" placeholder="영어로 쓰거나 🎤 를 누르세요" autocomplete="off" spellcheck="false">' +
      '<button class="btn" id="tsend">보내기</button></div>' +
    '<div class="row" style="margin-top:10px">' +
      '<button class="btn ghost" id="tend">' + (T.done ? "다시 하기" : "끝내기") + "</button></div>";
  const chat = $("chat"); chat.scrollTop = chat.scrollHeight;
  if (!T.done) {
    $("tsend").onclick = function(){ const v = $("ttext").value.trim(); if (v) { $("ttext").value = ""; say(v); } };
    $("ttext").onkeydown = function(e){ if (e.key === "Enter") $("tsend").onclick(); };
    $("tmic").onclick = mic;
  }
  $("tend").onclick = function(){
    if (T.done) { T = null; drawTalk(); return; }
    say(null, true);
  };
}
function say(text, finish){
  if (text) T.history.push({ role: "user", text: text });
  const r = RBTalkLocal.localTalk({ book: { title: B.title }, history: T.history, finish: !!finish });
  T.history.push({ role: "ai", text: r.reply });
  T.hint = r.hint; T.done = r.done;
  if (r.done) { S.talk = (S.talk || 0) + 1; save(); }
  drawTalk();
}
function mic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("ttext").placeholder = "이 브라우저는 말하기가 안 됩니다. 타자로 써 주세요."; return; }
  const r = new SR();
  r.lang = "en-US"; r.interimResults = false;
  r.onresult = function(e){ $("ttext").value = e.results[0][0].transcript; $("tsend").onclick(); };
  r.onerror = function(){ $("ttext").placeholder = "마이크를 쓸 수 없습니다. 타자로 써 주세요."; };
  try { r.start(); } catch (e) {}
}

/* ───────── ⑤ 낱말 노트 ───────── */
// 우리는 이 책에 어떤 낱말이 나오는지 모른다. 아이가 읽으며 만난 낱말을 스스로 옮겨 적는 칸이다.
function drawWord(){
  const rows = Array.from({ length: 8 }, function(_, i){
    const r = S.voc[i] || ["", "", ""];
    return '<tr><td class="no">' + (i + 1) + "</td>" + [0,1,2].map(function(j){
      return '<td><input data-k="voc" data-i="' + i + '" data-j="' + j + '" value="' + esc(r[j]) + '"></td>';
    }).join("") + "</tr>";
  }).join("");
  $("p-word").innerHTML =
    '<div class="box"><h2>낱말 노트</h2>' +
    '<p class="sub">책을 읽으며 새로 만난 낱말을 여덟 개 골라 적어 보세요. 뜻은 사전에서 찾아 적습니다.</p>' +
    '<table class="ws-tbl"><tr><th>No</th><th style="width:26%">Word</th><th style="width:26%">뜻</th>' +
    "<th>내 문장 My sentence</th></tr>" + rows + "</table></div>";
}

/* ───────── ⑥ 요약 지도 ───────── */
function drawSum(){
  const F = ["Somebody 누가", "Wanted 무엇을 바랐나", "But 그런데", "So 그래서", "Then 마침내"];
  const N = ["무엇에 대한 책인가", "새로 안 사실 ①", "새로 안 사실 ②", "새로 안 사실 ③", "더 알고 싶은 것"];
  const L = B.nf ? N : F;
  $("p-sum").innerHTML =
    '<div class="box"><h2>요약 지도</h2><p class="sub">' +
    (B.nf ? "읽은 내용을 다섯 칸에 정리해 보세요."
          : "이야기를 다섯 마디로 줄여 보세요. 이 다섯 칸이 곧 줄거리입니다.") + "</p>" +
    '<div class="swbst">' + L.map(function(t, i){
      return "<label><b>" + esc(t) + '</b><input data-k="swbst" data-i="' + i + '" value="' +
        esc(S.swbst[i]) + '"></label>';
    }).join("") + "</div></div>";
}

/* ───────── ⑦ 마인드맵 ───────── */
function drawMap(){
  const F = ["인물 Characters", "배경 Setting", "사건 Events", "주제 Theme"];
  const N = ["중심 낱말 Key words", "사실 Facts", "그림·표에서 본 것", "주제 Theme"];
  const L = B.nf ? N : F;
  $("p-map").innerHTML =
    '<div class="box"><h2>마인드맵</h2>' +
    '<p class="sub">가운데에 이 책을 놓고, 네 갈래로 뻗어 보세요.</p>' +
    '<p style="text-align:center; font-weight:700; color:#7b4f99; margin:4px 0 10px">' + esc(B.title) + "</p>" +
    '<div class="mmap">' + L.map(function(t, i){
      return "<div><b>" + esc(t) + '</b><textarea data-k="mm" data-i="' + i + '" rows="4">' +
        esc(S.mm[i]) + "</textarea></div>";
    }).join("") + "</div></div>";
}

/* ───────── ⑧ 생각 질문 ───────── */
function drawThink(){
  if (!A) {
    $("p-think").innerHTML = '<div class="box"><p class="sub">이 책은 아직 질문이 준비되지 않았습니다.</p></div>';
    return;
  }
  $("p-think").innerHTML = A.q.map(function(q, i){
    return '<div class="box"><h2>' + (i + 1) + ". " + esc(q) + "</h2>" +
      (A.h[i] ? '<p class="sub">' + esc(A.h[i]) + "</p>" : "") + tx("a", i, 3) + "</div>";
  }).join("");
}

/* ───────── ⑨ 독후 논술 ───────── */
// 줄거리를 모르므로 책의 갈래·주제로만 물음을 세운다. 답은 아이의 생각이다.
function drawEssay(){
  const th = (B.theme && B.theme !== "No theme") ? B.theme : B.genre;
  const ko = "이 책의 주제는 '" + th + "' 입니다. 책을 읽고 나서 '" + th +
    "' 에 대해 어떻게 생각하게 되었는지, 책에서 본 장면 하나를 들어 다섯 문장으로 써 보세요.";
  const en = "This book is about " + th + ". Write one paragraph: what do you now think about " +
    th + ", and which part of the book made you think so?";
  $("p-essay").innerHTML =
    '<div class="box"><h2>독후 논술</h2>' +
    '<p class="sub">' + esc(B.bl >= 4 ? en : ko) + "</p>" +
    (B.bl >= 4 ? "" : '<p class="sub noprint" style="opacity:.7">' + esc(en) + "</p>") +
    tx("essay", undefined, 10) + "</div>";
}

/* ───────── 시작 ───────── */
// 질문(act)과 영상(vid)은 Book No. 앞 세 글자로 쪼개 두었다. 그 책이 든 묶음 둘만 받는다.
function loadPack(dir, done){
  const tag = document.createElement("script");
  tag.src = dir + "/" + NO.slice(0, 3) + ".js";
  tag.onload = tag.onerror = done;
  document.head.appendChild(tag);
}
if (idx < 0) {
  MAIN.innerHTML = '<p class="sub">책을 찾지 못했습니다. <a href="index.html">목록으로</a></p>';
} else {
  loadPack("act", function(){ loadPack("vid", function(){
    B = CATALOG.at(idx);
    A = (window.ACT || {})[NO] || null;
    V = (window.VID || {})[NO] || [];
    const cv = COVER(NO);
    $("bt").textContent = B.title;
    $("bs").textContent = B.author + (B.series === "No series" ? "" : " · " + B.series);
    if (cv) $("cv").style.backgroundImage = "url('" + cv + "')";
    const h = (location.hash || "").slice(1);
    if (TABS.some(function(t){ return t.id === h; })) TAB = h;
    show();
    if (new URLSearchParams(location.search).get("print")) print();
  }); });
}
</script></body></html>

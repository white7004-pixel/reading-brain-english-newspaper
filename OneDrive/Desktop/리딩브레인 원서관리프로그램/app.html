        ${B.cover ? `<img class="lrcover" src="${esc(B.cover)}" alt="">` : ""}
        <table><tr><th>Title</th><td>${esc(B.title)}</td><th>Name</th><td>${esc(D.name || "-")}</td></tr>
          <tr><th>Time</th><td>${fmtSec(+D.sec || 0)} · ${+D.words || 0} words</td><th>Date</th><td>${esc(D.date)}</td></tr>
          <tr><th>Position</th><td>${stance}</td><th>Score</th><td><b>${avg.toFixed(1)}</b> / 4</td></tr></table>
      </div>
      <div class="dqbig">❓ ${esc(D.q)}</div>
      <div class="lrtag">📊 IB 토론 평가</div>
      <div class="dcrit">${Object.entries(CRIT_KO).map(([k, l]) => `
        <div><span>${l}</span><i><b style="width:${sc[k] * 25}%"></b></i><em>${"★".repeat(sc[k])}${"☆".repeat(4 - sc[k])}</em></div>`).join("")}</div>
      <div class="lrtag">👏 잘한 점</div>
      <ul class="dlist">${(a.strengths_ko || []).map(s => `<li>${esc(s)}</li>`).join("")}</ul>
      ${(a.next_ko || []).length ? `<div class="lrtag">🎯 다음에 해 볼 것</div>
      <ul class="dlist">${a.next_ko.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
      ${(a.better || []).length ? `<div class="lrtag">✨ 이렇게 말하면 더 좋아요</div>
        <ul class="dlist">${a.better.map(x => `<li><s>${esc(x.said)}</s><br>→ <b>${esc(x.better)}</b></li>`).join("")}</ul>` : ""}
      <div class="lrtag">💬 선생님 한마디</div>
      <div class="rpcom">${esc(a.summary_ko || "")}${a.summary_en ? `<br><i>${esc(a.summary_en)}</i>` : ""}
        ${a.mode === "practice" ? `<br><small>※ ${esc(a.note || "연습 분석(낱말 세기)이에요. 로그인하면 AI가 자세히 분석해요.")}</small>` : ""}</div>
      ${D.t ? `<details class="dtx"><summary>토론 내용 (음성 인식)</summary><p>${esc(D.t)}</p></details>` : ""}
    </div>`;
}

/* 리딩리포트 탭: 이 책의 모든 단계 결과를 한 장에 — 인쇄하거나 링크로 학부모께 보낸다 */

    </div>`;
  $("#rpPrint").onclick = () => RBReport.print($("#fullRep"));
  $("#rpShare").onclick = () => shareLink(reportLink(D), `${D.name ? D.name + " 학생의 " : ""}『${B.title}』 READING REPORT`, $("#rpMsg"));
}

// 화면에 그릴 내용만 뽑는다. 공유 링크에는 이것만 담긴다 (답안 전체·서술형 글은 담지 않는다)
async function reportData(){
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const test = get("test"), st = (get("learn") || {})._stage || {};
  const talk = get("talkScore"), quiz = get("quiz"), gram = get("grammar"), deb = get("debate"), ra = get("readaloud");
  const debAvg = d => (Object.values((d.a || {}).scores || {}).reduce((x, y) => x + (+y || 0), 0) / 5).toFixed(1);
  const mm = (get("mindmap") || {}).vals || [], mmAll = B.mindMap ? B.mindMap.branches.length * 2 : 0;
  const mmN = mm.filter(v => String(v).trim()).length;
  const essay = ((get("write") || {}).parts || []).join(" ").split(/\s+/).filter(Boolean).length;
  const sub = WHO ? RB.getSubmission(B.slug, WHO) : null;
  // 쉐도잉은 녹음 파일(브라우저 저장소)로만 알 수 있다
  const shadow = WHO ? await RB.getAudio(B.slug, WHO, "shadow").then(b => !!b).catch(() => false) : false;

  // 다시 볼 것: 틀린 단어 · 틀린 퀴즈 번호 · 틀린 문법 문제 번호
  const badWords = test ? [...new Set(test.answers.filter(a => !a.ok).map(a => a.word))] : [];
  const Q = B.quiz || [], badQuiz = quiz ? Q.map((q, i) => quiz.answers[i] === q.c ? 0 : i + 1).filter(Boolean) : [];
  const E = (B.grammar && B.grammar.exam) || {}, GI = [...(E.choose || []), ...(E.fix || []), ...(E.write || [])];
  const badGram = gram ? GI.map((g, i) => norm(gram.ans[i]) === norm(g.a) ? 0 : i + 1).filter(Boolean) : [];

  const rows = [
    ["🔤", "단어학습", test ? `Test ${pct(test.score, test.total)}점 (${test.score}/${test.total})`
        : st.sentence ? "Sentence까지 완료" : st.word ? "Word까지 완료" : "", !!test],
    ["📖", "쉐도잉", shadow ? "내 목소리 녹음 완료" : "", shadow],
    ["🎙️", "낭독녹음", ra ? `${ra.sec}초 · 낱말 ${ra.acc}% 읽음` : "", !!ra],
    ["💬", "AI 북토크", talk ? `${talk.times}회 · 말한 문장 ${talk.turns || 0}개` : "", !!talk],
    ["📘", "문법", gram ? `${gram.score}/${gram.total} (${pct(gram.score, gram.total)}점)` : "", !!gram],
    ["🗣️", "북디베이트", deb ? `${deb.sec}초 · ${deb.words}단어 · 평가 ${debAvg(deb)} / 4` : "", !!deb],
    ["🧠", "IB워크시트", [mmN ? `마인드맵 ${mmN}/${mmAll}칸` : "", essay ? `서술형 ${essay}단어` : "",
        sub ? (sub.feedback ? "선생님 피드백 받음" : "제출함") : ""].filter(Boolean).join(" · "),
        !!sub || (mmAll > 0 && mmN === mmAll)],
    ["✅", "북퀴즈", quiz ? `${quiz.score}/${quiz.total} (${pct(quiz.score, quiz.total)}점)` : "", !!quiz],
  ];

  // 한마디: 잘한 것과 더 할 것을 점수로 고른다
  const scored = [["단어", test && pct(test.score, test.total)], ["북퀴즈", quiz && pct(quiz.score, quiz.total)],
                  ["문법", gram && pct(gram.score, gram.total)]].filter(x => typeof x[1] === "number");
  const good = scored.filter(x => x[1] >= 80).map(x => x[0]), weak = scored.filter(x => x[1] < 70).map(x => x[0]);
  const left = rows.filter(r => !r[3]).map(r => r[1]);
  const comment = [
    good.length ? `${good.join("·")} 실력이 탄탄해요. 👏` : "",
    weak.length ? `${weak.join("·")}은(는) 아래 '다시 볼 것'을 한 번 더 복습해요.` : "",
    left.length ? `아직 ${left.join(", ")} 단계가 남았어요.` : "모든 단계를 끝냈어요! 이 책을 완주했습니다. 🎉",
  ].filter(Boolean).join(" ");

  return { name: String(WHO || "").replace(/^@/, ""), date: today(), rows, badWords, badQuiz, badGram,
           hasTest: !!test, hasQuiz: !!quiz, hasGram: !!gram, comment };
}

/* 공유 링크: 내용을 주소 # 뒤에 담는다 — # 뒤는 서버로 가지 않고, 받은 사람은 로그인 없이 바로 본다.
   #r= 리딩리포트, #d= 북디베이트 리포트 */
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)));
const pageLink = (kind, D) => location.origin + location.pathname + "?book=" + encodeURIComponent(B.slug) + "#" + kind + "=" + b64(JSON.stringify(D));
const reportLink = D => pageLink("r", D);

async function shareLink(url, title, msg){
  const text = "[리딩브레인] " + title;
  // 휴대폰이면 공유 창(카톡 바로 선택), 컴퓨터면 링크 복사 → 카톡 채널에 붙여넣기
  if (navigator.share && matchMedia("(pointer:coarse)").matches){
    try { await navigator.share({ title: text, text, url }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text + "\n" + url); msg.textContent = "✅ 링크를 복사했어요. 카톡에 붙여넣기 하세요."; }
  catch { prompt("아래 링크를 복사하세요", url); }
}

// 공유 링크로 들어온 사람(학부모)에게는 리포트 한 장만 보여 준다
function showShared(kind, code){
  let D = null;
  try { D = JSON.parse(unb64(code)); } catch {}
  document.body.classList.add("shared");
  $("#tabs").hidden = true;
  TABS.forEach(t => $("#p-" + t.id).hidden = t.id !== "report");
  const html = !D ? "" : kind === "r" && D.rows ? reportHTML(D) : kind === "d" && D.a ? debateHTML(D) : "";
  $("#p-report").innerHTML = html ? html + `
    <p class="sub" style="text-align:center; margin-top:14px">리딩브레인 영어학원에서 보낸 학습 기록입니다.</p>`
    : `<div class="empty">링크가 잘렸거나 잘못되었어요. 선생님께 다시 받아 주세요.</div>`;
}

/* IB워크시트 탭: 🧠 마인드맵(생각 넓히기) → ✍️ 서술형 쓰기 */
let WSTEP = "mind";
function drawWrite(){
  if (!B.mindMap) WSTEP = "essay";
  $("#p-write").innerHTML = `
    ${B.mindMap ? `<div class="vtabs wsub">
      <button data-w="mind"  class="${WSTEP === "mind"  ? "on" : ""}">🧠 마인드맵</button>
      <button data-w="essay" class="${WSTEP === "essay" ? "on" : ""}">✍️ 서술형 쓰기</button></div>` : ""}
    <div id="wbody"></div>`;
  $("#p-write").querySelectorAll(".wsub button").forEach(b =>
    b.onclick = () => { WSTEP = b.dataset.w; drawWrite(); });

// 가운데 책 제목, 둘레에 가지. 가지마다 위 칸 = 책에서 찾기, 아래 칸 = 내 생각
function drawMind(){
  const M = B.mindMap, vals = (get("mindmap") || {}).vals || [];
  const four = M.branches.length <= 4;
  $("#wbody").innerHTML = `
    <h2 class="h">마인드맵</h2>
    <p class="sub">가지마다 위 칸은 <b>책에서 찾아</b> 쓰고, 🔴 아래 칸은 <b>내 생각</b>을 써요. 다 채우면 서술형 쓰기가 쉬워져요.</p>
    <div class="mm ${four ? "four" : "six"}">
      <svg class="mm-lines"></svg>
      <div class="mm-c">${esc(M.center)}</div>
      ${M.branches.map((b, i) => `
        <div class="mm-b" style="grid-area:${"abcdef"[i]}">
          <div class="lab">${esc(b.label)}</div>
          <div class="ask">${esc(b.ask)}</div>
          <textarea data-k="${i * 2}" rows="2" placeholder="From the book…"></textarea>
          <div class="deep">🔴 ${esc(b.deeper)}</div>
          <textarea data-k="${i * 2 + 1}" rows="2" placeholder="I think…"></textarea>
        </div>`).join("")}
    </div>
    <div class="row">
      <button class="btn" id="mmGo">서술형 쓰러 가기 →</button>
      <a class="btn ghost" href="worksheets.html?book=${encodeURIComponent(B.slug)}" target="_blank">종이 워크시트로 인쇄</a>
      <span class="count" id="mmc"></span>
    </div>`;

  const box = $("#wbody .mm"), svg = box.querySelector("svg");
  const tas = [...box.querySelectorAll("textarea")];
  tas.forEach(t => t.value = vals[t.dataset.k] || "");
  const count = () => $("#mmc").textContent = `${tas.filter(t => t.value.trim()).length} / ${tas.length} 칸 채움`;
  let t = null;
  box.addEventListener("input", () => {
    count(); clearTimeout(t);
    t = setTimeout(() => put("mindmap", { vals: tas.map(x => x.value) }), 700);   // 자동 저장
  });
  count();

  // 가운데에서 가지로 선 긋기 — 글을 써서 칸이 커지면 다시 긋는다
  const lines = () => {
    const r = box.getBoundingClientRect(), c = box.querySelector(".mm-c").getBoundingClientRect();
    const mid = q => [q.left + q.width / 2 - r.left, q.top + q.height / 2 - r.top];
    const [cx, cy] = mid(c);
    svg.innerHTML = [...box.querySelectorAll(".mm-b")].map(b => {
      const [x, y] = mid(b.getBoundingClientRect());
      return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; }).join("");
  };
  lines(); new ResizeObserver(lines).observe(box);

  $("#mmGo").onclick = () => { WSTEP = "essay"; drawWrite(); scrollTo(0, 0); };
}

function drawEssay(){
  const E = B.essay, saved = get("write") || {}, sub = WHO ? RB.getSubmission(B.slug, WHO) : null;
  $("#wbody").innerHTML = `
    <h2 class="h">서술형 쓰기</h2>
    <p class="sub">칸마다 한두 문장씩. 다 쓰면 <b>제출하기</b> 를 누르세요. 선생님이 첨삭해 줍니다.</p>
    <div class="prompt">${esc(E.prompt)}</div>
    <div class="box">
      <div class="count" style="margin-bottom:6px">조건 · 다 채우면 ☑ 로 바뀝니다</div>
      <ul class="cond" id="cond">${E.conditions.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    </div>
    ${E.steps.map((s,i) => `
      <div class="step">
        <div class="lb">${esc(s.part)}<span>${esc(s.ask)}</span></div>
        <textarea data-i="${i}" rows="${Math.max(2, s.lines)}"></textarea>
        <div class="eg">보기 · ${esc(s.eg)}</div>
      </div>`).join("")}
    <div class="box">
      <div class="count" style="margin-bottom:8px">쓸 때 쓰면 좋은 표현</div>
      <div style="font-size:13.5px;color:#4d5560">${E.expressions.map(esc).join(" &nbsp;·&nbsp; ")}</div>
    </div>
    <div class="row">
      <button class="btn" id="send">제출하기</button>
      <span class="count" id="wc"></span>
    </div>
    <div id="fb"></div>`;

  const tas = [...$("#p-write").querySelectorAll("textarea")];
  tas.forEach((t,i) => { t.value = (saved.parts || [])[i] || ""; });

  const all = () => tas.map(t => t.value.trim()).filter(Boolean).join("\n");
  const refresh = () => {
    const text = all(), hits = checkConds(text);
    $("#cond").querySelectorAll("li").forEach((li,i) => li.classList.toggle("hit", !!hits[i]));
    const words = text.split(/\s+/).filter(Boolean).length;
    $("#wc").textContent = `${words} 단어 · 조건 ${hits.filter(Boolean).length}/${hits.length}`;
  };
  let t = null;
  tas.forEach(ta => ta.addEventListener("input", () => {
    refresh();
    clearTimeout(t);
    t = setTimeout(() => put("write", { parts: tas.map(x => x.value) }), 700);  // 자동 저장
  }));
  refresh();

  $("#send").onclick = async () => {
    if (!WHO){ alert("먼저 위에 이름을 적어 주세요."); $("#who").focus(); return; }
    const text = all();
    if (!text){ alert("아직 쓴 글이 없습니다."); return; }
    put("write", { parts: tas.map(x => x.value) });
    $("#send").disabled = true;
    try {
      await RB.submit({ slug: B.slug, title: B.title, who: WHO,
                        prompt: E.prompt, parts: tas.map(x => x.value),
                        labels: E.steps.map(s => s.part), text });
    } catch (e) {
      $("#send").disabled = false;
      alert("선생님께 보내지 못했습니다. 인터넷을 확인하고 다시 눌러 주세요. 쓴 글은 이 컴퓨터에 남아 있습니다.");
      return;
    }
    alert("제출했습니다. 선생님이 첨삭하면 이 화면에 나옵니다.");
    drawWrite(); drawTabs();
  };

  if (sub && sub.feedback){ $("#fb").innerHTML = feedbackView(sub); wireReport(sub); }
  else if (sub) $("#fb").innerHTML =
    `<div class="box" style="margin-top:14px"><b>제출함</b> · 선생님 첨삭을 기다리는 중입니다.</div>`;
}

/* 선생님 첨삭 결과 보기 */
function feedbackView(sub){
  const f = sub.feedback, notes = f.notes || [];
  let html = esc(sub.text), out = "", last = 0;
  // 뒤에서부터 끼워 넣어야 앞 글자 위치가 안 밀린다
  const marks = [...notes].map((n,i) => Object.assign({ i }, n))
                          .sort((a,b) => a.start - b.start);
  out = ""; last = 0;
  marks.forEach(m => {
    out += esc(sub.text.slice(last, m.start)) +
           `<mark title="${esc(m.note)}">${esc(sub.text.slice(m.start, m.end))}</mark>`;
    last = m.end;
  });
  out += esc(sub.text.slice(last));

  const rub = (f.scores || []).map(s =>
    `<tr><td>${esc(s.c)}</td><td class="n">${s.pt}</td><td>${esc(s.note || "")}</td></tr>`).join("");
  const total = (f.scores || []).reduce((a,b) => a + (+b.pt || 0), 0);

  const R = f.report, opts = { name: (RB.me() && RB.me().name) || sub.who, cover: B.cover, at: f.at,
    level: `AR ${B.level.ar}${B.level.rb ? " · " + B.level.rb : ""}` };
  const reportHtml = R ? `
  <h2 class="h" style="margin-top:22px">첨삭 리포트</h2>
  <div class="row"><button class="btn ghost" id="prRep">리포트 인쇄 / PDF</button></div>
  <div id="rpt">${RBReport.report(sub, R, opts)}</div>
  <h2 class="h" style="margin-top:26px">복습 워크시트</h2>
  <p class="sub">틀렸던 문장을 바르게 다시 쓰고 채점해 보세요. 생각 열기 질문에도 영어로 답해 보세요.</p>
  <div class="row"><button class="btn" id="rwGrade">채점하기</button>
    <button class="btn ghost" id="rwAns">정답 보기</button>
    <button class="btn ghost" id="prWs">워크시트 인쇄 / PDF</button>
    <span class="count" id="rwScore"></span></div>
  <div id="rws">${RBReport.worksheet(sub, R, Object.assign({ vals: (get("reviewSheet") || {}).vals }, opts))}</div>` : "";
  const manual = notes.length || f.overall || (f.scores || []).some(s => +s.pt || s.note);
  if (R && !manual) return reportHtml;   // AI 리포트만 쓴 첨삭

  return reportHtml + `
  <h2 class="h" style="margin-top:22px">선생님 첨삭</h2>
  <div class="marked-text">${out || "(빈 글)"}</div>
  ${notes.length ? `<div class="notes">${marks.map((m,k) => `
    <div class="note"><i>${k+1}</i><div><span class="q">${esc(sub.text.slice(m.start,m.end))}</span>${esc(m.note)}</div></div>`
    ).join("")}</div>` : ""}
  ${rub ? `<table class="t" style="margin-top:14px">
      <tr><th>준거</th><th style="width:50px">점수</th><th>한 마디</th></tr>${rub}
      <tr><th>합계</th><th>${total}</th><th></th></tr></table>` : ""}
  ${f.overall ? `<div class="fb"><b>총평</b><div>${esc(f.overall)}</div></div>` : ""}`;
}

/* 첨삭 리포트의 복습 워크시트: 쓰는 대로 저장, 채점하기 */
function wireReport(sub){
  const host = $("#rws");
  if (!host) return;
  const ws = host.querySelector(".rw");
  let t = null;
  ws.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => put("reviewSheet", { vals: RBReport.values(ws) }), 700);
  });
  $("#rwGrade").onclick = () => {
    const r = RBReport.gradeSheet(ws);
    $("#rwScore").textContent = `문장 ${r.ok} / ${r.total} 맞음 · 노란 칸은 선생님이 확인해요`;
    put("reviewSheet", { vals: RBReport.values(ws), ok: r.ok, total: r.total });
  };
  $("#rwAns").onclick = () => ws.classList.toggle("show-ans");
  $("#prRep").onclick = () => RBReport.print($("#rpt"));
  $("#prWs").onclick = () => RBReport.print(host);
}

  $("#ws").href = "worksheets.html?book=" + encodeURIComponent(B.slug);
  $("#bs").textContent = `AR ${B.level.ar} · ${B.level.lexile}${B.level.rb ? " · " + B.level.rb : ""}`;
  if (B.cover) $("#cv").style.backgroundImage = `url('${B.cover}')`;

  RB.chip($("#chip"));
  if (RB.role() === "student"){
    // 로그인한 학생: 이름은 고정, 한 것은 서버에서 받아 온다
    WHO = RB.whoKey();
    $("#who").hidden = true; $("label[for=who]").hidden = true;
    await RB.open(B.slug);
  } else {
    // 서버 없이 쓸 때: 이름은 이 브라우저에 기억해 둔다. 학원 컴퓨터에서 매번 치지 않도록.
    WHO = localStorage.getItem("rb1:who") || "";
    $("#who").value = WHO;
    $("#who").addEventListener("change", () => {
      WHO = $("#who").value.trim();
      localStorage.setItem("rb1:who", WHO);
      show();
    });
  }

  const h = location.hash.replace("#", "");
  if (h === "test") { TAB = "learn"; VSTEP = "test"; }        // 예전 단어테스트 탭 주소
  else if (TABS.some(t => t.id === h)) TAB = h;
  if (!h || !live().some(t => t.id === TAB)) TAB = live()[0].id;   // 주소에 탭이 없거나 이 책에 없는 탭이면 첫 탭으로 (파닉스 책은 파닉스부터)
  phSelftest();
  show();
}

const slug = new URLSearchParams(location.search).get("book") || "charlottes-web";
const tag = document.createElement("script");
tag.src = "books/" + slug + ".js";
tag.onload = start;
tag.onerror = () => document.querySelector("main").innerHTML =
  `<div class="empty">책 파일이 없습니다: books/${esc(slug)}.js</div>`;
document.head.appendChild(tag);
</script>
</body>
</html>
